[package]
name = "d-press"
version = "0.1.0"
edition = "2024"

[dependencies]
zip = "9.1"
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
liblzma = { version = "0.4", features = ["static"] }
sevenz-rust2 = { version = "0.24", features = ["aes256","bzip2","compress","util"] }
rars = "0.12"
infer = "0.22"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
indicatif = "0.18"
console = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwalk = "0.9"
figlet-rs = "1.0"

